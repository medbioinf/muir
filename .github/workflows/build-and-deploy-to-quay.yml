name: Docker build and push to quay

on:
  push:
    branches: [ "main" ]
  release:
    types: [ "published" ]
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all containers (ignore change detection)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  REGISTRY: quay.io

jobs:
  build_and_push_docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to registry
        uses: docker/login-action@v4
        with:
            registry: ${{ env.REGISTRY }}            
            username: ${{ secrets.QUAY_BOT_NAME }}
            password: ${{ secrets.QUAY_BOT_PASS }}

      - name: Build and push
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ "${{ github.event.inputs.build_all }}" == "true" ]]; then
            ./build-selective.sh ${{ secrets.QUAY_API_KEY }} --all
          else
            ./build-selective.sh ${{ secrets.QUAY_API_KEY }}
          fi
